{% extends "base.html" %}

{% block content %}
<div class="profile-wrapper">
    <div class="profile-card">
        <h1>Login</h1>
        <p class="dashboard-text">Welcome back! Please login to your account.</p>
        
        <form method="POST">
            <input type="email" name="email" placeholder="Email Address" required value="{{ email or '' }}">
            <input type="password" name="password" placeholder="Password" required>
            <button class="profile-btn" style="width: 100%;" type="submit">Login</button>
        </form>

        <p class="bottom-text" style="margin-top: 20px; color: var(--muted-color);">
            Don't have an account?
            <a href="{{ url_for('auth.register') }}" style="color: var(--primary); text-decoration: none; font-weight: 700;">Register</a>
        </p>
    </div>
</div>
{% endblock %}
