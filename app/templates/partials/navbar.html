<nav class="home-nav">
  <div class="left-nav">
    <a href="{{ url_for('home') }}" class="logo">
      <div class="logo-mark">🐾</div>
      <span>PetCare</span>
    </a>

    <div class="nav-links">
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('auth.dashboard') }}">Dashboard</a>
      <a href="{{ url_for('pets.view_pets') }}">My Pets</a>
      <a href="{{ url_for('lost_found.view_lost') }}">Lost & Found</a>
      <a href="{{ url_for('auth.profile') }}">Profile</a>
    </div>
  </div>

  <div class="right-nav">
    {% if session.get('user_id') %}
      <div style="display: flex; gap: 10px; align-items: center;">
        <a class="sign-btn" href="{{ url_for('auth.profile') }}">
          <i class="fa-regular fa-user"></i>
          <span>{{ session.get('name') }}</span>
        </a>
        <a href="{{ url_for('auth.logout') }}" style="color: var(--muted); font-size: 0.9rem; font-weight: 600;">Logout</a>
      </div>
    {% else %}
      <a class="sign-btn" href="{{ url_for('auth.login') }}">
        <i class="fa-regular fa-user"></i>
        <span>Sign In</span>
      </a>
    {% endif %}
  </div>
</nav>
