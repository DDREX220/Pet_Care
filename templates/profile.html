{% extends "base.html" %}

{% block content %}
<style>
    .profile-wrapper {
        display: flex;
        justify-content: center;
        padding: 40px 20px;
    }
    .profile-card {
        background: #fff;
        border-radius: 24px;
        padding: 40px;
        width: 100%;
        max-width: 500px;
        box-shadow: var(--shadow);
        border: 1px solid var(--line);
        text-align: center;
    }
    .profile-image {
        font-size: 4rem;
        background: #eef7f6;
        width: 100px;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        margin: 0 auto 20px;
    }
    .profile-email {
        color: var(--muted);
        margin-bottom: 20px;
    }
    .profile-description {
        color: #4a4a4a;
        margin-bottom: 30px;
        line-height: 1.6;
    }
    .profile-form {
        display: grid;
        gap: 16px;
        text-align: left;
    }
    .profile-form label {
        font-weight: 600;
        color: var(--accent-strong);
    }
    .profile-form input {
        padding: 12px;
        border-radius: 12px;
        border: 1px solid var(--line);
    }
</style>

<div class="profile-wrapper">
    <div class="profile-card">
        <div class="profile-image">
            👤
        </div>

        {% if current_user.is_authenticated %}
            <h1>{{ current_user.name }}</h1>
            <p class="profile-email">{{ current_user.email }}</p>

            <form action="{{ url_for('auth.profile') }}" method="POST" class="profile-form">
                <label>
                    Update Name
                    <input type="text" name="name" value="{{ current_user.name }}" required>
                </label>
                <button type="submit" class="secondary-button">Update Profile</button>
            </form>
            
            <div style="margin-top: 20px;">
                <a href="{{ url_for('auth.reset_password') }}" style="color: var(--accent); text-decoration: none; font-weight: 600;">Change Password</a>
            </div>
        {% else %}
            <h1>Guest User</h1>
            <p class="profile-email">Please sign in to view your profile.</p>
            <a href="{{ url_for('auth.login') }}" class="secondary-button">Sign In</a>
        {% endif %}
    </div>
</div>
{% endblock %}
