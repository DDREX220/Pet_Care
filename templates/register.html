{% extends "base.html" %}

{% block content %}
<div class="profile-wrapper">
    <div class="profile-card">
        <h1>Create Account</h1>
        <p class="dashboard-text">Join our community of pet lovers today!</p>
        
        <form method="POST">
            <input type="text" name="name" placeholder="Full Name" required value="{{ name or '' }}">
            <input type="email" name="email" placeholder="Email Address" required value="{{ email or '' }}">
            <input type="password" name="password" placeholder="Password" required>
            <button class="profile-btn" style="width: 100%;" type="submit">Register</button>
        </form>

        <p class="bottom-text" style="margin-top: 20px; color: var(--muted-color);">
            Already have an account?
            <a href="{{ url_for('auth.login') }}" style="color: var(--primary); text-decoration: none; font-weight: 700;">Login</a>
        </p>
    </div>
</div>
{% endblock %}
